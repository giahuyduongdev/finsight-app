# CodeRabbit Configuration for Finsight Project (Full-stack)
language: "en-US" # Standard English reviews

reviews:
  profile: "assertive" 
  request_changes_workflow: false
  auto_review:
    enabled: true 
    base_branches:
      - "develop"
      - "main"
      - "master"
  
  path_instructions:
    - path: "client/**/*"
      instructions: |
        You are a Senior Frontend Developer (React/Vite).
        1. Ensure React components comply with Accessibility (A11y) standards.
        2. Verify Tailwind CSS usage is efficient and follows best practices.
        3. Closely check Z-index and Focus Trap issues in Modals/Dialogs (Radix UI).
    - path: "backend/**/*"
      instructions: |
        You are a Senior Backend Developer (Node.js/Express).
        1. Audit security implementations (JWT, Passport).
        2. Optimize Mongoose (MongoDB) queries to prevent N+1 issues or missing indexes.
        3. Monitor BullMQ/Redis job handling to ensure system reliability and throughput.
        4. Optimize Google Generative AI (Gemini) API calls for cost and performance.
        5. Verify middleware logic and logging (Winston) accuracy.

  path_filters:
    - "**/*"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/public/**"
