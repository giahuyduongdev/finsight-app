# Cấu hình CodeRabbit chuẩn cho dự án Finsight (Full-stack)
language: "vi-VN" # Review hoàn toàn bằng tiếng Việt

reviews:
  profile: "assertive" 
  request_changes_workflow: false
  auto_review:
    enabled: true # Kích hoạt review cho cả các branch phụ (như develop)
  
  instructions: |
    Bạn là một chuyên gia Senior Full-stack Developer.
    ### FRONTEND (React/Vite):
    1. Đảm bảo các component React tuân thủ tính dễ tiếp cận (Accessibility).
    2. Kiểm tra việc sử dụng Tailwind CSS có đúng chuẩn và tối ưu không.
    3. Kiểm tra kỹ các vấn đề về Z-index và Focus Trap trong các Modal/Dialog (Radix UI).
    ### BACKEND (Express/Node.js):
    4. Kiểm tra kỹ các vấn đề về bảo mật (JWT, Passport).
    5. Tối ưu hóa các truy vấn Mongoose (MongoDB) để tránh n+1 hoặc thiếu Index.
    6. Kiểm tra việc xử lý jobs với BullMQ/Redis để đảm bảo không bị nghẽn (reliability).
    7. Lưu ý cách gọi API Google Generative AI (Gemini) để tối ưu chi phí và tốc độ.
    8. Đảm bảo các middleware và logging (Winston) hoạt động chính xác.

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!public/**"
    - "!package-lock.json"
    - "!yarn.lock"
    - "!pnpm-lock.yaml"

chat:
  auto_reply: true

# Ngữ cảnh dự án (Full-stack context)
knowledge_base:
  instructions: |
    Đây là dự án Finsight - nền tảng quản lý tài chính cá nhân toàn diện.
    - Tech Stack Frontend: React, Vite, Tailwind CSS, Radix UI (Shadcn), TanStack Query/Table.
    - Tech Stack Backend: Node.js (TypeScript), Express.js, MongoDB (Mongoose), Redis (BullMQ).
    - Integrations: Google Gemini AI, Cloudinary, Resend, Socket.io.
    - Quy tắc đặt tên: camelCase cho biến/hàm, PascalCase cho Components.
