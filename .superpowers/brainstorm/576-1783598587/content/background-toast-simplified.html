<h2>Background toast — simplified</h2>
<p class="subtitle">Removed the gear icon and “BACKGROUND TASK” label.</p>

<div class="mockup">
  <div class="mockup-header">Bottom-right toast</div>
  <div class="mockup-body" style="min-height:360px;position:relative;background:linear-gradient(135deg,#171c2a,#242a3a)">
    <div style="position:absolute;right:22px;bottom:22px;width:360px;padding:16px 18px;border:1px solid #91adf5;border-radius:11px;background:#f1f5ff;color:#183c7a;box-shadow:0 14px 34px #0007">
      <button aria-label="Close" style="position:absolute;right:11px;top:10px;border:0;background:transparent;color:#62759e;font-size:17px;cursor:pointer">×</button>
      <strong style="display:block;padding-right:24px;font-size:14px">Receipt scan completed</strong>
      <div style="font-size:12px;margin-top:6px;color:#526789">Receipt data is ready for review.</div>
      <div style="font-size:12px;font-weight:800;margin-top:10px;color:#175bcc">Review receipt →</div>
    </div>
  </div>
</div>

<div class="options">
  <div class="option" data-choice="approve-simplified-background-toast" onclick="toggleSelect(this)">
    <div class="letter">✓</div>
    <div class="content">
      <h3>Approve simplified toast</h3>
      <p>Title, description, action, and close button only.</p>
    </div>
  </div>
</div>
