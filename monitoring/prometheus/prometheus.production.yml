global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: finsight-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-api:8000

  - job_name: finsight-node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: finsight-redis
    static_configs:
      - targets:
          - redis-exporter:9121
