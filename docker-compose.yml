version: '3.8'

services:
  redis:
    image: redis:8.6.2
    container_name: finsight-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: /bin/sh -c 'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
    driver: local
